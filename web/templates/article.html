<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title or '量身分享' }}</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
                /* 文章头部 */
        .article-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .article-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
            color: #222;
        }

        .article-meta {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .article-meta a {
            color: #1976d2;
            text-decoration: none;
        }

        .article-meta a:hover {
            text-decoration: underline;
        }

        .article-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .article-tag {
            padding: 4px 12px;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 16px;
            font-size: 13px;
        }

        /* 正文内容 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #fafafa;
            color: #333;
            line-height: 1.8;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #fff;
            min-height: 100vh;
        }

        /* 正文内容 */
        .article-body {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }

        .article-body h1 {
            font-size: 24px;
            margin: 32px 0 16px;
            color: #222;
        }

        .article-body h2 {
            font-size: 20px;
            margin: 24px 0 12px;
            color: #333;
        }

        .article-body p {
            margin-bottom: 16px;
        }

        .article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 16px 0;
            display: block;
        }

        .article-body a {
            color: #1976d2;
            text-decoration: none;
        }

        .article-body a:hover {
            text-decoration: underline;
        }

        .article-body blockquote {
            border-left: 4px solid #e0e0e0;
            padding-left: 16px;
            margin: 16px 0;
            color: #666;
        }

        .article-body ul, .article-body ol {
            margin: 16px 0;
            padding-left: 24px;
        }

        .article-body li {
            margin-bottom: 8px;
        }

        .article-body code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 14px;
        }

        .article-body pre {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 16px 0;
        }

        .article-body pre code {
            background: none;
            padding: 0;
        }

        .article-end {
            text-align: center;
            font-size: 10px;
            color: #999;
            margin-top: 32px;
        }


    </style>
</head>
<body>
    <div class="container">
                <div class="article-header">
            <div class="article-title">{{ article.title or '量身分享' }}</div>
            <div class="article-tags">
                {% for tag in tags %}
                <span class="article-tag">{{ tag.label }}</span>
                {% endfor %}
            </div>
        </div>

        <div class="article-body" id="content"></div>

        <div class="article-end" id="text_end">{{'知识无界限，分享乐无边'}}</div>
    </div>

    <script>
        const markdown = {{ markdown|tojson }};
        document.getElementById('content').innerHTML = marked.parse(markdown);
    </script>
</body>
</html>
